<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="container">
        <div class="form-box">
            <h1>تسجيل الدخول</h1>
            <form id="loginForm">
                <label>رقم التليفون أو البريد الإلكتروني</label>
                <input type="text" id="phone" placeholder="رقم الطالب أو ولي الأمر" required>

                <label>كلمة المرور</label>
                <input type="password" id="password" placeholder="كلمة المرور" required>

                <button type="submit">دخول</button>
            </form>
            <p class="login-link">
                لا تملك حساب؟ <a href="register-student.html">تسجيل طالب جديد</a>
            </p>
            <p class="info">في حالة نسيان كلمة المرور يرجى التواصل مع إدارة المنصة</p>
        </div>
    </div>
    <script src="js/firebase.js"></script>
    <script src="js/auth.js"></script>
</body>

</html>
