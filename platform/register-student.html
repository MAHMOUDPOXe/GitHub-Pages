<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل طالب جديد</title>
    <link rel="stylesheet" href="css/main.css">
    <link rel="stylesheet" href="css/auth.css">
</head>

<body>
    <div class="container">
        <div class="form-box">
            <h1>تسجيل طالب جديد</h1>
            <form id="registerForm">
                <label>اسم الطالب *</label>
                <input type="text" id="studentName" placeholder="أدخل اسم الطالب" required>

                <label>رقم تليفون الطالب *</label>
                <input type="text" id="studentPhone" placeholder="أدخل رقم التليفون" required>

                <label>رقم تليفون ولي الأمر *</label>
                <input type="text" id="parentPhone" placeholder="أدخل رقم ولي الأمر" required>

                <label>الصف الدراسي *</label>
                <select id="grade" required>
                    <option value="">اختر الصف الدراسي</option>
                    <option value="first_secondary">الصف الأول الثانوي</option>
                    <option value="second_secondary">الصف الثاني الثانوي</option>
                    <option value="third_secondary">الصف الثالث الثانوي</option>
                </select>

                <label>المحافظة *</label>
                <select id="governorate" required>
                    <option value="">اختر المحافظة</option>
                    <option value="Cairo">القاهرة</option>
                    <option value="Giza">الجيزة</option>
                    <option value="Alexandria">الإسكندرية</option>
                    <option value="Dakahlia">الدقهلية</option>
                    <option value="RedSea">البحر الأحمر</option>
                    <option value="Beheira">البحيرة</option>
                    <option value="Fayoum">الفيوم</option>
                    <option value="Gharbia">الغربية</option>
                    <option value="Ismailia">الإسماعيلية</option>
                    <option value="Menofia">المنوفية</option>
                    <option value="Minya">المنيا</option>
                    <option value="Qalyubia">القليوبية</option>
                    <option value="NewValley">الوادي الجديد</option>
                    <option value="Suez">السويس</option>
                    <option value="Aswan">أسوان</option>
                    <option value="Assiut">أسيوط</option>
                    <option value="BeniSuef">بني سويف</option>
                    <option value="PortSaid">بورسعيد</option>
                    <option value="Damietta">دمياط</option>
                    <option value="Sharkia">الشرقية</option>
                    <option value="Sohag">سوهاج</option>
                    <option value="SouthSinai">جنوب سيناء</option>
                    <option value="KafrElSheikh">كفر الشيخ</option>
                    <option value="Matrouh">مطروح</option>
                    <option value="Luxor">الأقصر</option>
                    <option value="NorthSinai">شمال سيناء</option>
                </select>

                <div class="checkbox">
                    <input type="checkbox" id="agree" required>
                    <label for="agree">أوافق على الشروط وموافقة ولي الأمر</label>
                </div>

                <button type="submit" id="registerBtn">إنشاء الحساب</button>
            </form>
            <p class="login-link">هل لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
        </div>
    </div>

    <script src="js/firebase.js"></script>
    <script src="js/register.js"></script>
</body>

</html>
