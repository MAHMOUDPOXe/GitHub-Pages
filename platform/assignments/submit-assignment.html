<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسليم الواجب - المنصة التعليمية</title>
    <link rel="stylesheet" href="../css/main.css">
    <link rel="stylesheet" href="../css/assignments.css">
</head>

<body>
    <div class="container">
        <h1>تسليم الواجب</h1>
        <form id="submitAssignmentForm">
            <label>اختر الواجب</label>
            <select id="assignmentSelect">
                <option value="">-- اختر واجب --</option>
                <!-- سيتم ملء الخيارات بالـ JS -->
            </select>

            <label>رفع الملفات / الصور</label>
            <input type="file" id="assignmentFiles" multiple required>

            <button type="submit">تسليم الواجب</button>
        </form>
    </div>
    <script src="../js/assignments/submitAssignment.js"></script>
</body>

</html>
