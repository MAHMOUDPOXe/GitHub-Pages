<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعدادات الطالب - المنصة التعليمية</title>
    <link rel="stylesheet" href="/css/main.css">
    <link rel="stylesheet" href="/css/dashboard.css">
</head>

<body>
    <div class="container">
        <div class="form-box">
            <h1>تغيير كلمة المرور</h1>
            <form id="settingsForm">
                <label>كلمة المرور الحالية *</label>
                <input type="password" id="currentPassword" placeholder="أدخل كلمة المرور الحالية" required>

                <label>كلمة المرور الجديدة *</label>
                <input type="password" id="newPassword" placeholder="أدخل كلمة المرور الجديدة" required>

                <label>تأكيد كلمة المرور الجديدة *</label>
                <input type="password" id="confirmNewPassword" placeholder="تأكيد كلمة المرور الجديدة" required>

                <button type="submit">تحديث كلمة المرور</button>
            </form>
        </div>
    </div>
    <script src="../js/settings.js"></script>
</body>

</html>
